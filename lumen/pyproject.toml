[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumen"
version = "0.1.0"
description = "Twin-force memory and context framework for sovereign AI agents"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Lumen Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
urls = { Repository = "https://github.com/QuantumindSSI/lumen" }
dependencies = [
    # Force A: Mnemonic
    "sqlite-vec>=0.1.0",
    "usearch>=2.0",
    "kuzu>=0.4",
    "networkx>=3.0",
    "numpy>=1.26",
    "numba>=0.59",
    "lmdb>=1.4",
    "apscheduler>=3.10",
    "rank-bm25>=0.2.2",
    # Force B: Contextual
    "scikit-learn>=1.4",
    "fasttext-wheel>=0.9.2",
    "anytree>=2.12",
    "jinja2>=3.1",
    "structlog>=24.1",
    # Lumen: Unification
    "pydantic>=2.0",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.0",
    "msgspec>=0.18",
    "transitions>=0.9",
    "nevergrad>=1.0",
    "psutil>=5.9",
    "zeroconf>=0.132",
    "aiofiles>=23.0",
    # NLP / embeddings
    "spacy>=3.7",
    "onnxruntime>=1.17",
    "optimum[onnxruntime]>=1.17",
    # Local LLM (optional, large)
    "llama-cpp-python>=0.2.0 ; platform_machine == 'aarch64' or platform_machine == 'x86_64'",
    # API server (pilot requirement)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.3.0",
    "pre-commit>=3.6",
    "httpx>=0.27",
]
langchain = [
    "langchain>=0.3",
]
mcp = [
    "mcp>=1.0",
]
benchmarks = [
    "datasets>=5.0.0",
    "sentence-transformers>=2.0",
    "scipy>=1.10",
    "pytrec-eval>=0.5",
    "ir-measures>=0.3",
]

[project.scripts]
lumen = "lumen.cli.main:app"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --cov=lumen --cov-report=term-missing --cov-report=json --cov-fail-under=50"
